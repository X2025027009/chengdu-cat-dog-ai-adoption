<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="浏览小院的猫狗档案，按领养状态和种类筛选，了解它们的性格与领养要求。" />
    <title>寻找伙伴 · 成都猫狗小院</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <body data-page="pets">
    <!-- THESIS: One task, one real URL; the homepage welcomes, dedicated pages let visitors act.
       OWN-WORLD: Cream, warm yellow, rounded sans lettering, genuine courtyard photos and separate decorative art.
       STORY: Meet a pet, understand the fit and process, apply with care, then follow its new life; administration stays separate.
       FIRST VIEWPORT: Home retains copy-left/photo-right; task pages put title and primary tool first, with active navigation.
       FORM: Preview-led visual refresh of the existing buildless multipage site.
       FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="site-header" id="top">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="成都猫狗小院首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path
                d="M18.7 14.5c-2.6-4.1-6.5-5.8-8.6-5.5-1.2.2-1.8 1.4-1.4 2.5 1.3 3.6 3.5 6.3 6.2 7.4M29.4 14.7c2.5-4.1 6.3-5.9 8.5-5.7 1.2.1 1.9 1.3 1.6 2.5-1 3.7-3.1 6.5-5.8 7.8"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
              />
              <path d="M24 17.5c-8.1 0-13.5 5.7-13.5 13.5 0 7.4 5.6 11.5 13.5 11.5S37.5 38.4 37.5 31C37.5 23.2 32.1 17.5 24 17.5Z" fill="currentColor" opacity=".95" />
              <path d="M20.3 29.1c.9-1.1 2.1-1.7 3.7-1.7s2.8.6 3.7 1.7M20.5 34.3c1 .8 2.1 1.2 3.5 1.2s2.5-.4 3.5-1.2" stroke="#fff8ef" stroke-width="2.1" stroke-linecap="round" />
            </svg>
          </span>
          <span><strong>成都猫狗小院</strong><small>领养代替购买</small></span>
        </a>

        <button class="menu-toggle" id="menuToggle" aria-label="打开导航" aria-expanded="false" aria-controls="siteNav"><span></span><span></span><span></span></button>

        <nav class="site-nav" id="siteNav" aria-label="主导航">
          <a href="index.html">首页</a>
          <a href="pets.html" aria-current="page">寻找伙伴</a>
          <a href="match.html">AI 匹配</a>
          <a href="adoption.html">如何领养</a>
          <a href="stories.html">回访档案</a>
          <a href="about.html">关于小院</a>
          <a class="nav-admin" href="admin.html">管理员入口</a>
        </nav>
      </div>
    </header>

    <div class="local-review-notice" id="localReviewNotice" hidden>
      <div class="container"><strong>本地审核预览</strong><span>示例与本机数据 · 不连接云端，操作只保存在本浏览器。</span></div>
    </div>
    <main id="main">
      <div class="container" id="applicantNotice" hidden></div>
      <section class="section pets-section" id="pets">
        <div class="container">
          <div class="pets-page-top">
            <div class="section-heading pets-intro">
              <h1 class="page-title">小院里的等待</h1>
              <p>合适的领养，从不急着决定开始。</p>
            </div>
            <div class="page-illustration page-illustration-pets" aria-hidden="true"></div>
          </div>

          <div class="filters pets-filter-stack" role="toolbar" aria-label="筛选宠物">
            <div class="filter-group" aria-label="按状态筛选">
              <button class="filter-button active" data-filter="status" data-value="待领养" aria-pressed="true">待领养</button>
              <button class="filter-button" data-filter="status" data-value="已领养" aria-pressed="false">已领养档案</button>
              <button class="filter-button" data-filter="status" data-value="暂不适合领养" aria-pressed="false">暂不适合领养</button>
            </div>
            <div class="filter-group filter-group-secondary" aria-label="按种类筛选">
              <button class="filter-button filter-type active" data-filter="type" data-value="全部" aria-pressed="true">全部</button>
              <button class="filter-button filter-type" data-filter="type" data-value="猫咪" aria-pressed="false">猫咪</button>
              <button class="filter-button filter-type" data-filter="type" data-value="狗狗" aria-pressed="false">狗狗</button>
            </div>
          </div>

          <div class="pet-grid" id="petGrid" aria-live="polite"></div>
          <div class="empty-state hidden" id="emptyState">
            <strong>暂时没有符合条件的小动物</strong>
            <p>换一个筛选条件再看看吧。</p>
          </div>
        </div>
      </section>
      <aside class="page-next pets-ai-cta container" aria-label="下一步">
        <div class="cta-illustration" aria-hidden="true"></div>
        <div class="cta-copy">
          <h2>还不确定哪一只适合你的生活？</h2>
          <p>可以和 AI 匹配助手聊聊，找到更合适的伙伴。</p>
        </div>
        <a class="button button-primary" href="match.html">和 AI 匹配助手聊聊<span aria-hidden="true">→</span></a>
      </aside>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <a class="brand brand-footer" href="index.html"
          ><span class="brand-mark" aria-hidden="true"
            ><svg viewBox="0 0 48 48" fill="none">
              <path
                d="M18.7 14.5c-2.6-4.1-6.5-5.8-8.6-5.5-1.2.2-1.8 1.4-1.4 2.5 1.3 3.6 3.5 6.3 6.2 7.4M29.4 14.7c2.5-4.1 6.3-5.9 8.5-5.7 1.2.1 1.9 1.3 1.6 2.5-1 3.7-3.1 6.5-5.8 7.8"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
              />
              <path d="M24 17.5c-8.1 0-13.5 5.7-13.5 13.5 0 7.4 5.6 11.5 13.5 11.5S37.5 38.4 37.5 31C37.5 23.2 32.1 17.5 24 17.5Z" fill="currentColor" opacity=".95" />
              <path d="M20.3 29.1c.9-1.1 2.1-1.7 3.7-1.7s2.8.6 3.7 1.7M20.5 34.3c1 .8 2.1 1.2 3.5 1.2s2.5-.4 3.5-1.2" stroke="#fff8ef" stroke-width="2.1" stroke-linecap="round" /></svg></span
          ><span><strong>成都猫狗小院</strong><small>领养代替购买</small></span></a
        >
        <p>当前为示例网站原型，动物资料与联系方式均可由管理员在后台替换。</p>
        <div class="footer-actions">
          <button class="footer-admin" id="footerEditApplication">修改我的申请</button>
          <a class="footer-admin" href="admin.html">管理员入口</a>
        </div>
      </div>
    </footer>

    <div class="modal-backdrop hidden" id="modalBackdrop" aria-hidden="true">
      <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
    </div>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

    <script src="site-config.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
